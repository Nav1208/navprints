<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Navprints</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 500: '#2563eb', 600: '#1d4ed8' }
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main id="loginPanel" class="mx-auto flex min-h-screen max-w-md items-center px-5">
      <form id="loginForm" class="w-full rounded-3xl bg-white p-7 shadow-xl shadow-slate-200/60">
        <a href="index.html" class="grid h-11 w-11 place-items-center rounded-xl bg-brand-600 text-xl font-bold text-white">
          N
        </a>
        <h1 class="mt-5 text-2xl font-bold">Admin sign in</h1>
        <p class="mt-1 text-sm text-slate-500">Access your customer upload queue.</p>
        <label class="mt-6 block text-sm font-medium">
          Email
          <input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand-500">
        </label>
        <label class="mt-4 block text-sm font-medium">
          Password
          <input id="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand-500">
        </label>
        <button class="mt-6 min-h-12 w-full rounded-xl bg-brand-600 font-bold text-white hover:bg-brand-500">Sign in</button>
      </form>
    </main>

    <section id="dashboardPanel" class="hidden mx-auto max-w-6xl px-5 py-7 sm:px-8">
      <header class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <p class="text-sm font-semibold text-brand-600">ADMIN DASHBOARD</p>
          <h1 class="text-2xl font-bold">Customer uploads</h1>
        </div>
        <button id="logout" class="rounded-xl border border-slate-300 px-4 py-2 font-semibold hover:bg-slate-100">Log out</button>
      </header>
      <div class="mt-7 grid gap-3 rounded-2xl bg-white p-4 shadow-sm sm:grid-cols-3">
        <input id="search" type="search" placeholder="Search customer name" class="rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand-500 sm:col-span-2">
        <select id="sort" class="rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand-500">
          <option value="newest">Date: newest first</option>
          <option value="oldest">Date: oldest first</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
      <div id="uploadList" class="mt-5 overflow-hidden rounded-2xl bg-white shadow-sm"></div>
    </section>

    <div id="toast" class="toast fixed bottom-5 left-5 right-5 z-30 mx-auto max-w-md rounded-xl px-4 py-3 text-center font-medium text-white shadow-xl"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
