<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Navprints</title>

    <link rel="icon" type="image/png" href="pfp.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 500: '#2563eb', 600: '#1d4ed8' }
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif']
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
    <main id="loginPanel" class="flex min-h-screen items-center justify-center bg-black px-5">
      <form id="loginForm" class="w-full max-w-md rounded-3xl border border-white/10 bg-neutral-900 p-7 shadow-2xl">
        <a href="index.html" class="inline-flex">
          <img src="pfp.png" alt="Navprints logo" class="h-11 w-11 rounded-full object-cover">
        </a>
        <h1 class="mt-5 text-2xl font-bold text-white">Admin sign in</h1>
        <p class="mt-1 text-sm text-white/50">Access your customer upload queue.</p>

        <label class="mt-6 block text-sm font-medium text-white/70">
          Email
          <input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-white placeholder:text-white/30 outline-none focus:border-white focus:bg-white/10">
        </label>
        <label class="mt-4 block text-sm font-medium text-white/70">
          Password
          <input id="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-white placeholder:text-white/30 outline-none focus:border-white focus:bg-white/10">
        </label>

        <button class="mt-6 min-h-12 w-full rounded-full bg-white font-bold text-black hover:bg-white/90">Sign in</button>
      </form>
    </main>

    <section id="dashboardPanel" class="hidden min-h-screen">
      <header class="bg-black">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-5 py-5 sm:px-8">
          <a href="index.html" class="inline-flex items-center gap-2.5">
            <img src="pfp.png" alt="Navprints logo" class="h-8 w-8 rounded-full object-cover">
            <span class="text-base font-bold tracking-tight text-white">Navprints</span>
          </a>
          <button id="logout" class="rounded-full border border-white/20 px-4 py-2 text-sm font-semibold text-white hover:bg-white/10">Log out</button>
        </div>
      </header>

      <div class="mx-auto max-w-6xl px-5 py-7 sm:px-8">
        <h1 class="text-2xl font-bold">Customer uploads</h1>
        <p class="mt-1 text-sm text-slate-500">View and download files from your upload queue.</p>

        <div class="mt-7 grid gap-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 sm:grid-cols-3">
          <input id="search" type="search" placeholder="Search customer name" class="rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand-500 sm:col-span-2">
          <select id="sort" class="rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand-500">
            <option value="newest">Date: newest first</option>
            <option value="oldest">Date: oldest first</option>
            <option value="name">Name: A–Z</option>
          </select>
        </div>

        <div id="uploadList" class="mt-5 divide-y divide-slate-100 overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200"></div>
      </div>
    </section>

    <div id="toast" class="toast fixed bottom-5 left-5 right-5 z-30 mx-auto max-w-md rounded-xl px-4 py-3 text-center font-medium text-white shadow-xl"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
