<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upload a file for Navprints.">
    <title>Navprints</title>

    <link rel="icon" type="image/png" href="pfp.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                500: '#2563eb',
                600: '#1d4ed8'
              }
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif']
            }
          }
        }
      };
    </script>

    <link rel="stylesheet" href="styles.css">
  </head>

  <body class="h-[100dvh] overflow-hidden bg-black text-white font-sans antialiased flex flex-col">
    <header class="mx-auto w-full max-w-6xl px-6 py-4 sm:py-6">
      <a href="index.html" class="inline-flex items-center gap-2.5">
        <img src="pfp.png" alt="Navprints logo" class="h-8 w-8 rounded-full object-cover">
        <span data-business-name class="text-base font-bold tracking-tight">Navprints</span>
      </a>
    </header>

    <main class="flex flex-1 flex-col items-center justify-center px-6 text-center min-h-0">
      <h1 class="max-w-xl text-3xl font-extrabold leading-[1.1] tracking-tight sm:text-6xl">
        Print your files today.
      </h1>
      <p class="mt-4 max-w-sm text-sm text-white/60 sm:mt-5 sm:text-base">
        Upload a file, add your name, and we'll have it ready to print.
      </p>

      <button id="startUpload" class="mt-6 inline-flex min-h-12 items-center justify-center rounded-full bg-white px-8 py-3 text-base font-bold text-black hover:bg-white/90 sm:mt-9 sm:min-h-14 sm:py-4">
        Upload file
      </button>

      <p class="mt-3 text-xs text-white/40 sm:mt-4">Files are held for 7 days.</p>
    </main>

    <footer class="border-t border-white/10 py-4 sm:py-6">
      <p class="text-center text-xs text-white/40">© <span data-year></span> <span data-business-name>Navprints</span></p>
    </footer>

    <div id="nameModal" class="fixed inset-0 z-20 hidden items-end bg-black/70 backdrop-blur-sm p-4 sm:items-center sm:justify-center">
      <div class="w-full max-w-md rounded-3xl border border-white/10 bg-neutral-900 p-7 shadow-2xl">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 class="text-xl font-bold text-white">Before you upload</h2>
            <p class="mt-1 text-sm text-white/50">What name should we put on this print job?</p>
          </div>
          <button id="closeModal" aria-label="Close" class="text-2xl leading-none text-white/40 hover:text-white">×</button>
        </div>

        <form id="nameForm">
          <input id="customerName" required maxlength="80" autocomplete="name" placeholder="Your full name" class="mt-6 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-white placeholder:text-white/30 outline-none focus:border-white focus:bg-white/10">
          <button class="mt-4 min-h-12 w-full rounded-full bg-white font-bold text-black hover:bg-white/90">Continue to files</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast fixed bottom-5 left-5 right-5 z-30 mx-auto max-w-md rounded-xl px-4 py-3 text-center font-medium text-white shadow-xl"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/cloudinary.js"></script>
    <script src="js/public-upload.js"></script>
  </body>
</html>
